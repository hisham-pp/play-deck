<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07120e" />
      <stop offset="50%" stop-color="#0a1a14" />
      <stop offset="100%" stop-color="#030706" />
    </linearGradient>
    <linearGradient id="snakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pelletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="pelletGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#ambientGlow)" />

  <!-- Cyber Matrix Grid -->
  <g stroke="#10b981" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="560" y1="0" x2="560" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
  </g>

  <!-- Snake Tail Path & Segments -->
  <g filter="url(#emeraldGlow)">
    <!-- Body track -->
    <path d="M 120 330 L 260 330 A 40 40 0 0 0 300 290 L 300 170 A 40 40 0 0 1 340 130 L 520 130 A 40 40 0 0 1 560 170 L 560 250 A 40 40 0 0 0 600 290 L 640 290" 
          fill="none" stroke="url(#snakeGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Snake Head -->
    <circle cx="640" cy="290" r="18" fill="#6ee7b7" />
    <!-- Eyes -->
    <circle cx="645" cy="284" r="3.5" fill="#042f2e" />
    <circle cx="645" cy="296" r="3.5" fill="#042f2e" />
    <circle cx="646" cy="283" r="1.2" fill="#ffffff" />
    <circle cx="646" cy="295" r="1.2" fill="#ffffff" />
  </g>

  <!-- Golden Target Pellet -->
  <g filter="url(#pelletGlow)">
    <circle cx="715" cy="290" r="14" fill="url(#pelletGrad)" />
    <circle cx="712" cy="287" r="4" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Corner Arcade Accents -->
  <path d="M 20 50 L 20 20 L 50 20" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 780 50 L 780 20 L 750 20" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 20 400 L 20 430 L 50 430" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />
  <path d="M 780 400 L 780 430 L 750 430" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Subtle Title Watermark in background -->
  <text x="50" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#10b981" fill-opacity="0.12" letter-spacing="4">RETRO SNAKE</text>
</svg>
