<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="snakeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="snakeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pelletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="256" height="256" rx="48" fill="url(#snakeBg)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- Grid pattern lines -->
  <path d="M64 32 V224 M128 32 V224 M192 32 V224 M32 64 H224 M32 128 H224 M32 192 H224"
        stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.6" />

  <!-- Snake Body with subtle glow -->
  <g filter="url(#emeraldGlow)">
    <!-- Body Path (Arcade serpentine bend) -->
    <path d="M56 192 H128 C144 192 156 180 156 164 C156 148 144 136 128 136 H96 C80 136 68 124 68 108 C68 92 80 80 96 80 H184"
          fill="none" stroke="url(#snakeBody)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Snake Head (with eye) -->
    <circle cx="192" cy="80" r="14" fill="#34d399" />
    <circle cx="196" cy="76" r="3.5" fill="#064e3b" />
  </g>

  <!-- Energy Pellet with golden pulse -->
  <circle cx="192" cy="164" r="12" fill="url(#pelletGrad)" filter="url(#emeraldGlow)" />
  <circle cx="192" cy="164" r="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 3" opacity="0.8" />
</svg>
