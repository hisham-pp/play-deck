<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1306" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="coverGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#coverGlow)" />

  <!-- Arcade Grid Accents -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="390" x2="800" y2="390" />
  </g>

  <!-- Centerpiece Artwork -->
  <g filter="url(#neonGlowCover)">
    <g transform="translate(250, 80) rotate(8 150 170)">
      <line x1="20" y1="170" x2="280" y2="170" stroke="#f59e0b" stroke-width="18" stroke-linecap="round"/>
      <rect x="80" y="80" width="60" height="75" rx="8" fill="#71717a"/>
      <rect x="150" y="105" width="50" height="50" rx="8" fill="#a1a1aa"/>
    </g>
  </g>

  <!-- Title Watermark / Typography -->
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#f59e0b" fill-opacity="0.2" letter-spacing="4">UNSTABLE ELEVATOR</text>
  <text x="750" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" fill-opacity="0.4" text-anchor="end" letter-spacing="2">PLAYDECK CARTRIDGE</text>
</svg>
