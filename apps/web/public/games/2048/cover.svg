<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="g2048Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c160c" />
      <stop offset="50%" stop-color="#2a1f10" />
      <stop offset="100%" stop-color="#0f0c06" />
    </linearGradient>
    <linearGradient id="tile2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="tile1024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="tile512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#g2048Bg)" />

  <!-- Background grid slots -->
  <g fill="#332414" opacity="0.6">
    <rect x="80" y="50" width="100" height="100" rx="16" />
    <rect x="200" y="50" width="100" height="100" rx="16" />
    <rect x="320" y="50" width="100" height="100" rx="16" />
    <rect x="80" y="170" width="100" height="100" rx="16" />
    <rect x="80" y="290" width="100" height="100" rx="16" />
  </g>

  <!-- Number Tiles -->
  <!-- 512 Tile -->
  <g transform="translate(200, 170)">
    <rect width="100" height="100" rx="16" fill="url(#tile512)" />
    <text x="50" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">512</text>
  </g>

  <!-- 1024 Tile -->
  <g transform="translate(320, 170)">
    <rect width="100" height="100" rx="16" fill="url(#tile1024)" />
    <text x="50" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">1024</text>
  </g>

  <!-- Massive Crown 2048 Tile -->
  <g transform="translate(460, 90)" filter="url(#tileGlow)">
    <rect width="260" height="260" rx="32" fill="url(#tile2048)" stroke="#fef08a" stroke-width="4" />
    <text x="130" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">2048</text>
    <text x="130" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#713f12" text-anchor="middle" letter-spacing="4">LEGENDARY</text>
  </g>

  <!-- Floating Sparkles -->
  <circle cx="440" cy="80" r="4" fill="#fde047" opacity="0.8" />
  <circle cx="740" cy="120" r="5" fill="#fde047" opacity="0.8" />
  <circle cx="710" cy="370" r="4" fill="#fde047" opacity="0.8" />

  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#eab308" fill-opacity="0.12" letter-spacing="4">SLIDE &amp; MERGE</text>
</svg>
