<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>
    <linearGradient id="gold2048" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tileOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="tileCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container -->
  <rect width="256" height="256" rx="48" fill="url(#bg2048)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.35" />

  <!-- Subsurface board -->
  <rect x="30" y="30" width="196" height="196" rx="20" fill="#0b111e" stroke="#1e293b" stroke-width="3" />

  <!-- Empty background grid slots -->
  <rect x="40" y="40" width="40" height="40" rx="8" fill="#151e31" />
  <rect x="88" y="40" width="40" height="40" rx="8" fill="#151e31" />
  <rect x="136" y="40" width="40" height="40" rx="8" fill="#151e31" />
  <rect x="184" y="40" width="40" height="40" rx="8" fill="#151e31" />

  <rect x="40" y="88" width="40" height="40" rx="8" fill="#151e31" />
  <rect x="88" y="88" width="40" height="40" rx="8" fill="#151e31" />
  <rect x="136" y="88" width="40" height="40" rx="8" fill="#151e31" />
  <rect x="184" y="88" width="40" height="40" rx="8" fill="#151e31" />

  <!-- Small tiles -->
  <!-- Tile 2 -->
  <rect x="40" y="40" width="40" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="66" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">2</text>

  <!-- Tile 4 -->
  <rect x="88" y="40" width="40" height="40" rx="8" fill="#451a03" stroke="#78350f" stroke-width="1.5" />
  <text x="108" y="66" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">4</text>

  <!-- Tile 8 -->
  <rect x="136" y="40" width="40" height="40" rx="8" fill="url(#tileOrange)" />
  <text x="156" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">8</text>

  <!-- Tile 16 -->
  <rect x="184" y="40" width="40" height="40" rx="8" fill="url(#tileCoral)" />
  <text x="204" y="66" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle">16</text>

  <!-- Hero Tile: 2048 spanning the center-bottom -->
  <g filter="url(#goldGlow)">
    <rect x="40" y="96" width="176" height="88" rx="16" fill="url(#gold2048)" stroke="#fef08a" stroke-width="2" />
    <text x="128" y="157" fill="#090d16" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" text-anchor="middle" letter-spacing="-1">2048</text>
  </g>

  <!-- Bottom Accent Row -->
  <rect x="40" y="192" width="40" height="24" rx="6" fill="#10b981" />
  <text x="60" y="209" fill="#090d16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">128</text>

  <rect x="88" y="192" width="40" height="24" rx="6" fill="#06b6d4" />
  <text x="108" y="209" fill="#090d16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">512</text>

  <rect x="136" y="192" width="88" height="24" rx="6" fill="#8b5cf6" />
  <text x="180" y="209" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle">ARCADE</text>
</svg>
