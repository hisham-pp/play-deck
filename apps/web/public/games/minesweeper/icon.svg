<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="msBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>
    <linearGradient id="mineMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="flagGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base container -->
  <rect width="256" height="256" rx="48" fill="url(#msBg)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Subsurface field board -->
  <rect x="36" y="36" width="184" height="184" rx="16" fill="#0b111e" stroke="#1e293b" stroke-width="3" />

  <!-- Cell Grid lines -->
  <path d="M36 97 H220 M36 158 H220 M97 36 V220 M158 36 V220" stroke="#1e293b" stroke-width="3" />

  <!-- Top-left cell: Number 3 in vibrant rose -->
  <text x="66" y="80" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="34" font-weight="900" text-anchor="middle">3</text>

  <!-- Top-right cell: Number 1 in electric blue -->
  <text x="189" y="80" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="34" font-weight="900" text-anchor="middle">1</text>

  <!-- Bottom-left cell: Number 2 in emerald -->
  <text x="66" y="202" fill="#34d399" font-family="ui-monospace, monospace" font-size="34" font-weight="900" text-anchor="middle">2</text>

  <!-- Center cell: Tactical Mine -->
  <g transform="translate(128, 128)">
    <!-- Spikes -->
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="-22" y1="22" x2="22" y2="-22" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    
    <!-- Mine core body -->
    <circle cx="0" cy="0" r="22" fill="url(#mineMetal)" stroke="#334155" stroke-width="3" />
    <circle cx="-6" cy="-6" r="4" fill="#94a3b8" />
    <circle cx="0" cy="0" r="6" fill="#ef4444" filter="url(#glow)" />
  </g>

  <!-- Bottom-right cell: Tactical Gold Flag -->
  <g transform="translate(174, 172)" filter="url(#glow)">
    <path d="M0 32 V4 M0 4 L22 14 L0 24 Z" fill="url(#flagGlow)" />
    <line x1="-4" y1="32" x2="6" y2="32" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
