<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="tetrisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <radialGradient id="tetrisGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="blockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#tetrisBg)" />
  <rect width="800" height="450" fill="url(#tetrisGlow)" />

  <!-- Tetris Grid Matrix -->
  <g stroke="#3b82f6" stroke-opacity="0.08" stroke-width="1">
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="260" y1="0" x2="260" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="380" y1="0" x2="380" y2="450" />
    <line x1="440" y1="0" x2="440" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="560" y1="0" x2="560" y2="450" />
    <line x1="620" y1="0" x2="620" y2="450" />
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="330" x2="800" y2="330" />
    <line x1="0" y1="390" x2="800" y2="390" />
  </g>

  <!-- Glowing Tetromino Blocks -->
  <g filter="url(#blockGlow)">
    <!-- T-Piece (Purple) -->
    <g transform="translate(320, 80)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#a855f7" stroke="#d8b4fe" stroke-width="2" />
      <rect x="58" y="0" width="56" height="56" rx="8" fill="#a855f7" stroke="#d8b4fe" stroke-width="2" />
      <rect x="116" y="0" width="56" height="56" rx="8" fill="#a855f7" stroke="#d8b4fe" stroke-width="2" />
      <rect x="58" y="58" width="56" height="56" rx="8" fill="#a855f7" stroke="#d8b4fe" stroke-width="2" />
    </g>

    <!-- I-Piece (Cyan) falling at an angle -->
    <g transform="translate(120, 160) rotate(-15)">
      <rect x="0" y="0" width="54" height="54" rx="8" fill="#06b6d4" stroke="#67e8f9" stroke-width="2" />
      <rect x="56" y="0" width="54" height="54" rx="8" fill="#06b6d4" stroke="#67e8f9" stroke-width="2" />
      <rect x="112" y="0" width="54" height="54" rx="8" fill="#06b6d4" stroke="#67e8f9" stroke-width="2" />
      <rect x="168" y="0" width="54" height="54" rx="8" fill="#06b6d4" stroke="#67e8f9" stroke-width="2" />
    </g>

    <!-- O-Piece (Yellow/Amber) -->
    <g transform="translate(560, 200)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#eab308" stroke="#fef08a" stroke-width="2" />
      <rect x="58" y="0" width="56" height="56" rx="8" fill="#eab308" stroke="#fef08a" stroke-width="2" />
      <rect x="0" y="58" width="56" height="56" rx="8" fill="#eab308" stroke="#fef08a" stroke-width="2" />
      <rect x="58" y="58" width="56" height="56" rx="8" fill="#eab308" stroke="#fef08a" stroke-width="2" />
    </g>

    <!-- L-Piece (Orange) at the base -->
    <g transform="translate(380, 270)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#f97316" stroke="#fed7aa" stroke-width="2" />
      <rect x="0" y="58" width="56" height="56" rx="8" fill="#f97316" stroke="#fed7aa" stroke-width="2" />
      <rect x="0" y="116" width="56" height="56" rx="8" fill="#f97316" stroke="#fed7aa" stroke-width="2" />
      <rect x="58" y="116" width="56" height="56" rx="8" fill="#f97316" stroke="#fed7aa" stroke-width="2" />
    </g>

    <!-- Z-Piece (Red) -->
    <g transform="translate(200, 328)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
      <rect x="58" y="0" width="56" height="56" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
      <rect x="58" y="58" width="56" height="56" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
      <rect x="116" y="58" width="56" height="56" rx="8" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
    </g>
  </g>

  <!-- Title Watermark -->
  <text x="50" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#a855f7" fill-opacity="0.12" letter-spacing="4">TETROMINO DECK</text>
</svg>
