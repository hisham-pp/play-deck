<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tetrisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="tetrisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#tetrisBg)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Grid pattern lines -->
  <path d="M64 32 V224 M128 32 V224 M192 32 V224 M32 64 H224 M32 128 H224 M32 192 H224"
        stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 4" stroke-opacity="0.6" />

  <g filter="url(#tetrisGlow)">
    <!-- I piece (vertical, cyan) -->
    <rect x="60" y="72" width="26" height="104" rx="5" fill="url(#cyanGrad)" />

    <!-- O piece (yellow square) -->
    <rect x="96" y="140" width="52" height="52" rx="6" fill="url(#amberGrad)" />

    <!-- T piece (purple) -->
    <rect x="156" y="66" width="26" height="26" rx="5" fill="url(#purpleGrad)" />
    <rect x="130" y="92" width="26" height="26" rx="5" fill="url(#purpleGrad)" />
    <rect x="156" y="92" width="26" height="26" rx="5" fill="url(#purpleGrad)" />
    <rect x="182" y="92" width="26" height="26" rx="5" fill="url(#purpleGrad)" />

    <!-- L piece (orange) -->
    <rect x="182" y="130" width="26" height="26" rx="5" fill="url(#orangeGrad)" />
    <rect x="182" y="156" width="26" height="26" rx="5" fill="url(#orangeGrad)" />
    <rect x="182" y="182" width="26" height="26" rx="5" fill="url(#orangeGrad)" />
    <rect x="156" y="182" width="26" height="26" rx="5" fill="url(#orangeGrad)" />
  </g>
</svg>
