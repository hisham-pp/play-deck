<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f080e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#e11d48" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <line x1="60" y1="200" x2="160" y2="200" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="200" x2="100" y2="60" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="60" x2="170" y2="60" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <line x1="170" y1="60" x2="170" y2="85" stroke="#f59e0b" stroke-width="4"/>
      <circle cx="170" cy="105" r="16" fill="none" stroke="#e11d48" stroke-width="5"/>
      <line x1="170" y1="121" x2="170" y2="155" stroke="#e11d48" stroke-width="5"/>
  </g>
</svg>
