<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1305" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Vault Chamber -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#111827" stroke="#232f45" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#goldGlow)" />

  <!-- Thematic Gavel & Mystery Box Iconography -->
  <g filter="url(#neonGold)">
    <!-- Mystery Box Base -->
    <rect x="78" y="130" width="100" height="70" rx="12" fill="#1c2438" stroke="#f59e0b" stroke-width="5" />
    <path d="M78 152 L178 152" stroke="#f59e0b" stroke-width="4" stroke-dasharray="6 4" />
    <text x="128" y="178" font-family="monospace" font-size="28" font-weight="bold" fill="#f59e0b" text-anchor="middle">?</text>

    <!-- Golden Gavel -->
    <g transform="rotate(-30 130 90)">
      <rect x="110" y="58" width="46" height="24" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
      <rect x="128" y="82" width="10" height="52" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    </g>
  </g>
</svg>
