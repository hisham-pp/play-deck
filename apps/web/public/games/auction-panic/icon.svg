<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221406" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <g transform="translate(60, 50) rotate(-25 60 60)">
      <rect x="40" y="30" width="30" height="70" rx="6" fill="#78350f" stroke="#f59e0b" stroke-width="4"/>
      <rect x="15" y="45" width="80" height="40" rx="8" fill="#b45309" stroke="#f59e0b" stroke-width="4"/>
    </g>
    <rect x="68" y="170" width="120" height="24" rx="6" fill="#451a03"/>
  </g>
</svg>
