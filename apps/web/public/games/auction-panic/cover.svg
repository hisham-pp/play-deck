<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241707" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="goldCoverGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGoldCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#goldCoverGlow)" />

  <!-- Architectural Vault Scanlines -->
  <g opacity="0.12" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Central Graphic -->
  <g filter="url(#neonGoldCover)" transform="translate(400, 180)">
    <!-- Glowing Pedestal -->
    <ellipse cx="0" cy="90" rx="140" ry="30" fill="#1c2438" stroke="#f59e0b" stroke-width="3" />
    <!-- Mystery Chest -->
    <rect x="-60" y="20" width="120" height="80" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="4" />
    <text x="0" y="70" font-family="monospace" font-size="36" font-weight="bold" fill="#f59e0b" text-anchor="middle">?</text>
    <!-- Gavel -->
    <g transform="rotate(-25) translate(-10, -40)">
      <rect x="-30" y="-12" width="60" height="24" rx="4" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
      <rect x="-6" y="12" width="12" height="60" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    </g>
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AUCTION PANIC</text>
  <text x="400" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="4">MYSTERY BIDDING &amp; TREASURE VAULT</text>
</svg>
