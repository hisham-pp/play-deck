<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a163a" />
      <stop offset="70%" stop-color="#0c0e1a" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>
    <linearGradient id="bladeP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bladeP2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="160" height="160" rx="36" fill="url(#bgGlow)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Clash burst circle -->
  <circle cx="80" cy="80" r="28" fill="#f59e0b" fill-opacity="0.15" />
  <circle cx="80" cy="80" r="14" fill="#ffffff" fill-opacity="0.25" />

  <!-- Blade 1 (Player 1 Cyan Katana - diagonal top-left to bottom-right) -->
  <line x1="32" y1="32" x2="128" y2="128" stroke="url(#bladeP1)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <!-- Guard & Hilt -->
  <line x1="110" y1="126" x2="126" y2="110" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
  <line x1="118" y1="118" x2="138" y2="138" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
  <line x1="120" y1="120" x2="136" y2="136" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

  <!-- Blade 2 (Player 2 Crimson Katana - diagonal top-right to bottom-left) -->
  <line x1="128" y1="32" x2="32" y2="128" stroke="url(#bladeP2)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <!-- Guard & Hilt -->
  <line x1="50" y1="126" x2="34" y2="110" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
  <line x1="42" y1="118" x2="22" y2="138" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
  <line x1="40" y1="120" x2="24" y2="136" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

  <!-- Sparks at clash point (80, 80) -->
  <circle cx="80" cy="80" r="4" fill="#ffffff" filter="url(#glow)" />
  <path d="M80,68 L82,78 L92,80 L82,82 L80,92 L78,82 L68,80 L78,78 Z" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="94" cy="66" r="2.5" fill="#fef08a" />
  <circle cx="66" cy="94" r="2.5" fill="#38bdf8" />
  <circle cx="96" cy="92" r="2" fill="#f43f5e" />
  <circle cx="64" cy="68" r="2" fill="#ffffff" />
</svg>
