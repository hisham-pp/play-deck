<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2018" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="emeraldCoverGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="neonCoverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#emeraldCoverGlow)" />

  <!-- Realm Grid Scanlines -->
  <g opacity="0.1" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Isometric / Orthogonal 3x3 Realm Grid Preview -->
  <g opacity="0.2" transform="translate(400, 150) rotate(15) scale(0.9)">
    <rect x="-120" y="-120" width="80" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="-30" y="-120" width="80" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <rect x="60" y="-120" width="80" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="-120" y="-30" width="80" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <rect x="-30" y="-30" width="80" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <rect x="60" y="-30" width="80" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" />
  </g>

  <!-- Central Crown & Fortress Iconography -->
  <g filter="url(#neonCoverGlow)" transform="translate(400, 160)">
    <!-- Fortress Pedestal -->
    <rect x="-80" y="30" width="160" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="3" />
    <!-- Battlements -->
    <rect x="-80" y="16" width="28" height="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="-14" y="16" width="28" height="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="52" y="16" width="28" height="18" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <!-- Gate Arch -->
    <path d="M-18 80 L-18 52 Q0 40 18 52 L18 80 Z" fill="#090d16" stroke="#f59e0b" stroke-width="2" />

    <!-- Royal Crown -->
    <path d="M-60 12 L-44 -38 L-18 -12 L0 -50 L18 -12 L44 -38 L60 12 Z" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
    <circle cx="-44" cy="-38" r="5" fill="#ef4444" />
    <circle cx="0" cy="-50" r="7" fill="#10b981" />
    <circle cx="44" cy="-38" r="5" fill="#3b82f6" />
    <circle cx="0" cy="-2" r="5" fill="#10b981" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">KINGDOM DRAFT</text>
  <text x="400" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle" letter-spacing="4">SPATIAL STRATEGY &amp; REALM DRAFTING</text>
</svg>
