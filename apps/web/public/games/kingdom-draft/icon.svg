<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Realm Chamber -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#111827" stroke="#232f45" stroke-width="2" />
  <circle cx="128" cy="128" r="76" fill="url(#emeraldGlow)" />

  <!-- 3x3 Realm Grid Lines subtle -->
  <g stroke="#10b981" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="4 3">
    <line x1="60" y1="100" x2="196" y2="100" />
    <line x1="60" y1="148" x2="196" y2="148" />
    <line x1="104" y1="60" x2="104" y2="196" />
    <line x1="152" y1="60" x2="152" y2="196" />
  </g>

  <!-- Crown & Castle Fortress Motif -->
  <g filter="url(#neonGold)">
    <!-- Castle Keep Silhouette -->
    <path d="M76 172 L76 136 L92 136 L92 144 L108 144 L108 136 L148 136 L148 144 L164 144 L164 136 L180 136 L180 172 Z" fill="#1e293b" stroke="#3b82f6" stroke-width="3" />
    <path d="M116 172 L116 154 Q128 148 140 154 L140 172 Z" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />

    <!-- Royal Golden Crown -->
    <path d="M84 126 L94 88 L114 106 L128 76 L142 106 L162 88 L172 126 Z" fill="#f59e0b" stroke="#d97706" stroke-width="3" />
    <!-- Crown Jewels -->
    <circle cx="94" cy="88" r="4" fill="#ef4444" />
    <circle cx="128" cy="76" r="5" fill="#10b981" />
    <circle cx="162" cy="88" r="4" fill="#3b82f6" />
    <!-- Emerald Crest in center of crown band -->
    <circle cx="128" cy="116" r="3.5" fill="#10b981" />
  </g>
</svg>
