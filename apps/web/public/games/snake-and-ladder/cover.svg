<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062016" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="coverGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#coverGlow)" />

  <!-- Arcade Grid Accents -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="390" x2="800" y2="390" />
  </g>

  <!-- Centerpiece Artwork -->
  <g filter="url(#neonGlowCover)">
    <g transform="translate(180, 50)">
      <path d="M80 320 Q180 200, 260 260 T420 120" fill="none" stroke="#10b981" stroke-width="32" stroke-linecap="round" opacity="0.85"/>
      <line x1="120" y1="60" x2="260" y2="300" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
      <line x1="160" y1="40" x2="300" y2="280" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
      <line x1="130" y1="100" x2="170" y2="80" stroke="#fef08a" stroke-width="8"/>
      <line x1="165" y1="150" x2="205" y2="130" stroke="#fef08a" stroke-width="8"/>
      <line x1="200" y1="200" x2="240" y2="180" stroke="#fef08a" stroke-width="8"/>
      <line x1="235" y1="250" x2="275" y2="230" stroke="#fef08a" stroke-width="8"/>
    </g>
  </g>

  <!-- Title Watermark / Typography -->
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#10b981" fill-opacity="0.2" letter-spacing="4">SNAKE & LADDER</text>
  <text x="750" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" fill-opacity="0.4" text-anchor="end" letter-spacing="2">PLAYDECK CARTRIDGE</text>
</svg>
