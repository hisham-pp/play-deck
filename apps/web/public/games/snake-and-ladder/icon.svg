<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062016" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <path d="M60 200 Q100 140, 140 180 T200 110" fill="none" stroke="#10b981" stroke-width="18" stroke-linecap="round"/>
      <line x1="80" y1="60" x2="160" y2="190" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="48" x2="180" y2="178" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
      <line x1="86" y1="80" x2="106" y2="70" stroke="#fef08a" stroke-width="5"/>
      <line x1="106" y1="110" x2="126" y2="100" stroke="#fef08a" stroke-width="5"/>
      <line x1="126" y1="140" x2="146" y2="130" stroke="#fef08a" stroke-width="5"/>
      <line x1="146" y1="170" x2="166" y2="160" stroke="#fef08a" stroke-width="5"/>
  </g>
</svg>
