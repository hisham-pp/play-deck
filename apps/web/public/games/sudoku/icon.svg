<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sudokuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050a12" />
    </linearGradient>
    <linearGradient id="sudokuInk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="sudokuGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#sudokuBg)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.3" />

  <!-- Board surface -->
  <rect x="40" y="40" width="176" height="176" rx="12" fill="#0b1220" />

  <!-- Active cell and its peers -->
  <g fill="#f59e0b">
    <rect x="40" y="98" width="176" height="60" fill-opacity="0.05" />
    <rect x="98" y="40" width="60" height="176" fill-opacity="0.05" />
    <rect x="98" y="98" width="60" height="60" fill-opacity="0.14" />
  </g>

  <!-- Faint sub-cell rules, the hint of a full 9x9 -->
  <path d="M59 40 V216 M78 40 V216 M117 40 V216 M137 40 V216 M176 40 V216 M196 40 V216
           M40 59 H216 M40 78 H216 M40 117 H216 M40 137 H216 M40 176 H216 M40 196 H216"
        stroke="#1e293b" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Box rules -->
  <path d="M98 40 V216 M158 40 V216 M40 98 H216 M40 158 H216"
        stroke="#3b4a68" stroke-width="5" stroke-linecap="square" />

  <!-- Outer frame -->
  <rect x="40" y="40" width="176" height="176" rx="12" fill="none" stroke="#64748b" stroke-width="6" />

  <!-- Given digits -->
  <g fill="#e2e8f0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="44" font-weight="700" text-anchor="middle">
    <text x="69" y="85">5</text>
    <text x="187" y="85">3</text>
    <text x="69" y="143">8</text>
    <text x="128" y="201">4</text>
    <text x="187" y="201">7</text>
  </g>

  <!-- The player's entry, in the tactical amber -->
  <g filter="url(#sudokuGlow)">
    <text x="128" y="145" fill="url(#sudokuInk)"
          font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="50" font-weight="800" text-anchor="middle">9</text>
  </g>
</svg>
