<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e36" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <path d="M70 130 C70 95, 120 80, 160 95 C195 110, 205 145, 185 175 C160 205, 100 200, 75 170 Z" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
      <circle cx="155" cy="115" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
      <circle cx="160" cy="115" r="6" fill="#0f172a"/>
      <path d="M170 140 L210 148 L170 162 Z" fill="#f97316" stroke="#c2410c" stroke-width="3"/>
      <ellipse cx="105" cy="150" rx="30" ry="18" fill="#fef08a" stroke="#d97706" stroke-width="3" transform="rotate(-15 105 150)"/>
  </g>
</svg>
