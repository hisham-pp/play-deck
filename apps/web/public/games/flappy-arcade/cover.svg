<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e36" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="coverGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#coverGlow)" />

  <!-- Arcade Grid Accents -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="390" x2="800" y2="390" />
  </g>

  <!-- Centerpiece Artwork -->
  <g filter="url(#neonGlowCover)">
    <rect x="580" y="0" width="70" height="180" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
      <rect x="565" y="160" width="100" height="30" rx="6" fill="#4ade80" stroke="#15803d" stroke-width="4"/>
      <rect x="580" y="290" width="70" height="160" rx="8" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
      <rect x="565" y="270" width="100" height="30" rx="6" fill="#4ade80" stroke="#15803d" stroke-width="4"/>
      <g transform="translate(240, 180) scale(1.4)">
        <path d="M70 130 C70 95, 120 80, 160 95 C195 110, 205 145, 185 175 C160 205, 100 200, 75 170 Z" fill="#fbbf24" stroke="#d97706" stroke-width="3"/>
        <circle cx="155" cy="115" r="14" fill="#ffffff"/>
        <circle cx="160" cy="115" r="6" fill="#0f172a"/>
        <path d="M170 140 L210 148 L170 162 Z" fill="#f97316"/>
        <ellipse cx="105" cy="150" rx="30" ry="18" fill="#fef08a" transform="rotate(-15 105 150)"/>
      </g>
  </g>

  <!-- Title Watermark / Typography -->
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#38bdf8" fill-opacity="0.2" letter-spacing="4">FLAPPY ARCADE</text>
  <text x="750" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" fill-opacity="0.4" text-anchor="end" letter-spacing="2">PLAYDECK CARTRIDGE</text>
</svg>
