<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgPong" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanPaddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="amberPaddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ballGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgPong)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.25" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />

  <!-- Center Court Dashed Net -->
  <line x1="128" y1="36" x2="128" y2="220" stroke="#334155" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" />

  <!-- Center Ring -->
  <circle cx="128" cy="128" r="32" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Left Paddle (Cyan) -->
  <rect x="42" y="76" width="12" height="74" rx="6" fill="url(#cyanPaddle)" filter="url(#cyanGlow)" />

  <!-- Right Paddle (Amber) -->
  <rect x="202" y="116" width="12" height="74" rx="6" fill="url(#amberPaddle)" filter="url(#amberGlow)" />

  <!-- Ball Trail Streaks -->
  <circle cx="82" cy="116" r="4" fill="#22d3ee" opacity="0.2" />
  <circle cx="106" cy="120" r="6" fill="#38bdf8" opacity="0.4" />
  <circle cx="132" cy="124" r="8" fill="#e2e8f0" opacity="0.6" />

  <!-- The Ball -->
  <circle cx="158" cy="128" r="10" fill="#ffffff" filter="url(#ballGlow)" />

  <!-- Corner Sparks -->
  <circle cx="48" cy="100" r="2" fill="#67e8f9" opacity="0.8" />
  <circle cx="56" cy="94" r="1.5" fill="#a5f3fc" opacity="0.6" />
</svg>
