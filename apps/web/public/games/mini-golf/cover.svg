<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062312" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="coverGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#coverGlow)" />

  <!-- Arcade Grid Accents -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="390" x2="800" y2="390" />
  </g>

  <!-- Centerpiece Artwork -->
  <g filter="url(#neonGlowCover)">
    <path d="M100 360 Q400 420, 700 360" fill="none" stroke="#22c55e" stroke-width="28" stroke-linecap="round"/>
      <circle cx="400" cy="380" r="28" fill="#0f172a" stroke="#16a34a" stroke-width="6"/>
      <line x1="400" y1="380" x2="400" y2="140" stroke="#f8fafc" stroke-width="8"/>
      <polygon points="400,140 500,185 400,230" fill="#ef4444"/>
      <circle cx="280" cy="345" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
      <path d="M220 310 Q250 330, 280 345" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 8"/>
  </g>

  <!-- Title Watermark / Typography -->
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#22c55e" fill-opacity="0.2" letter-spacing="4">MINI GOLF</text>
  <text x="750" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" fill-opacity="0.4" text-anchor="end" letter-spacing="2">PLAYDECK CARTRIDGE</text>
</svg>
