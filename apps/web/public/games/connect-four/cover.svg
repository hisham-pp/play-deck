<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="c4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1d" />
      <stop offset="50%" stop-color="#0f1d3d" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="gridBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="discRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="discYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="winGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#c4Bg)" />

  <!-- Connect 4 Vertical Matrix Shell -->
  <g transform="translate(160, 50)">
    <rect width="480" height="340" rx="24" fill="url(#gridBlue)" stroke="#60a5fa" stroke-width="3" />

    <!-- Discs Layer (Behind or In slots) -->
    <!-- Falling Disc in Action -->
    <g transform="translate(240, -25)" filter="url(#winGlow)">
      <circle cx="0" cy="0" r="28" fill="url(#discYellow)" stroke="#fef08a" stroke-width="2" />
      <path d="M 0 -50 L 0 -10" stroke="#facc15" stroke-width="3" stroke-dasharray="4 4" />
    </g>

    <!-- Discs on Board (Winning Diagonal Alignment of Yellow Discs) -->
    <g filter="url(#winGlow)">
      <!-- 4 in a row diagonal line -->
      <line x1="80" y1="270" x2="320" y2="90" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
      <circle cx="80" cy="270" r="28" fill="url(#discYellow)" stroke="#fef08a" stroke-width="2" />
      <circle cx="160" cy="210" r="28" fill="url(#discYellow)" stroke="#fef08a" stroke-width="2" />
      <circle cx="240" cy="150" r="28" fill="url(#discYellow)" stroke="#fef08a" stroke-width="2" />
      <circle cx="320" cy="90" r="28" fill="url(#discYellow)" stroke="#fef08a" stroke-width="2" />
    </g>

    <!-- Red Discs Counter Plays -->
    <circle cx="80" cy="210" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />
    <circle cx="160" cy="270" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />
    <circle cx="240" cy="270" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />
    <circle cx="320" cy="270" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />
    <circle cx="320" cy="210" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />
    <circle cx="400" cy="270" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />
    <circle cx="240" cy="210" r="28" fill="url(#discRed)" stroke="#fca5a5" stroke-width="2" />

    <!-- Empty Cutout Slots (Holes in board) -->
    <g fill="#070d1d" opacity="0.6">
      <circle cx="80" cy="90" r="24" />
      <circle cx="80" cy="150" r="24" />
      <circle cx="160" cy="90" r="24" />
      <circle cx="160" cy="150" r="24" />
      <circle cx="240" cy="90" r="24" />
      <circle cx="400" cy="90" r="24" />
      <circle cx="400" cy="150" r="24" />
      <circle cx="400" cy="210" r="24" />
    </g>
  </g>

  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#3b82f6" fill-opacity="0.12" letter-spacing="4">CONNECT FOUR</text>
</svg>
