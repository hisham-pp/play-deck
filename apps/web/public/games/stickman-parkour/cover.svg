<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="36" fill="#090D16"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="url(#parkour_sky)"/>
  
  <!-- Neon Skyline Silhouettes -->
  <rect x="180" y="260" width="120" height="330" fill="#0B132B" opacity="0.6"/>
  <rect x="340" y="180" width="160" height="410" fill="#1C2541" opacity="0.7"/>
  <rect x="540" y="220" width="140" height="370" fill="#0B132B" opacity="0.8"/>
  <rect x="720" y="160" width="180" height="430" fill="#1C2541" opacity="0.9"/>
  <rect x="940" y="280" width="140" height="310" fill="#0B132B" opacity="0.6"/>

  <!-- Glowing Windows & Neon Beams -->
  <line x1="340" y1="180" x2="500" y2="180" stroke="#06B6D4" stroke-width="4"/>
  <line x1="720" y1="160" x2="900" y2="160" stroke="#8B5CF6" stroke-width="4"/>
  <circle cx="850" cy="130" r="50" fill="#F8FAFC" fill-opacity="0.1"/>

  <!-- Rooftop Platforms & Gaps -->
  <rect x="80" y="440" width="460" height="150" rx="6" fill="#111827" stroke="#1E293B" stroke-width="4"/>
  <rect x="620" y="400" width="500" height="190" rx="6" fill="#111827" stroke="#1E293B" stroke-width="4"/>

  <!-- Wall Jump Facade on right roof -->
  <rect x="620" y="320" width="30" height="80" fill="#334155" stroke="#06B6D4" stroke-width="3"/>

  <!-- Momentum Speed Streaks -->
  <path d="M400 370H520" stroke="#06B6D4" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 12"/>
  <path d="M460 330H600" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-dasharray="20 16"/>
  <path d="M520 290L640 260" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round"/>

  <!-- Parkour Stickman Mid-Air Leap -->
  <circle cx="560" cy="310" r="32" fill="#F8FAFC"/>
  <!-- Angled Torso in tuck leap -->
  <path d="M560 342L595 400" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round"/>
  <!-- Reaching Lead Arm -->
  <path d="M570 360L630 350L680 340" stroke="#06B6D4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trailing Arm -->
  <path d="M570 360L525 385L490 370" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Tucked Legs ready for landing roll -->
  <path d="M595 400L645 425L695 410" stroke="#06B6D4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M595 400L550 435L515 420" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Typography -->
  <text x="120" y="110" fill="#06B6D4" font-family="Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="6">PLAYDECK</text>
  <text x="120" y="380" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="96" font-weight="800">STICKMAN</text>
  <text x="120" y="475" fill="#06B6D4" font-family="Arial, sans-serif" font-size="96" font-weight="800">PARKOUR</text>
  <text x="120" y="530" fill="#94A3B8" font-family="Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3">ROOFTOP FREERUNNING &amp; WALL VAULTS</text>

  <defs>
    <linearGradient id="parkour_sky" x1="120" y1="60" x2="1080" y2="582" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B132B"/>
      <stop offset="0.5" stop-color="#090D16"/>
      <stop offset="1" stop-color="#140A28"/>
    </linearGradient>
  </defs>
</svg>
