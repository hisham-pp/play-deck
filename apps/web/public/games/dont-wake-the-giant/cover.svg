<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160927" />
      <stop offset="50%" stop-color="#0a101d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="coverGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlowCover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#coverGlow)" />

  <!-- Arcade Grid Accents -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="390" x2="800" y2="390" />
  </g>

  <!-- Centerpiece Artwork -->
  <g filter="url(#neonGlowCover)">
    <g transform="translate(240, 60)">
      <ellipse cx="160" cy="170" rx="90" ry="60" fill="#4c1d95"/>
      <path d="M110 155 Q135 170, 160 155" fill="none" stroke="#f59e0b" stroke-width="6"/>
      <path d="M170 155 Q195 170, 220 155" fill="none" stroke="#f59e0b" stroke-width="6"/>
      <text x="240" y="90" font-size="54" font-weight="bold" fill="#fde047">Zzz</text>
    </g>
  </g>

  <!-- Title Watermark / Typography -->
  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#8b5cf6" fill-opacity="0.2" letter-spacing="4">DON'T WAKE THE GIANT</text>
  <text x="750" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94a3b8" fill-opacity="0.4" text-anchor="end" letter-spacing="2">PLAYDECK CARTRIDGE</text>
</svg>
