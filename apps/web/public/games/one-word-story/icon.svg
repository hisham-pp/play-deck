<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a0e" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonType" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4" />

  <!-- Inner Chamber -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#111827" stroke="#232f45" stroke-width="2" />
  <circle cx="128" cy="128" r="76" fill="url(#amberGlow)" />

  <!-- Parchment Page Silhouette -->
  <path d="M78 68 L160 68 L178 86 L178 184 L78 184 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <path d="M160 68 L160 86 L178 86 Z" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />

  <!-- Typewritten Lines -->
  <line x1="94" y1="98" x2="146" y2="98" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="94" y1="112" x2="162" y2="112" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="94" y1="126" x2="152" y2="126" stroke="#92400e" stroke-width="2.5" stroke-linecap="round" />

  <!-- Golden Typewriter / Key Motif -->
  <g filter="url(#neonType)">
    <!-- Typewriter Frame Base -->
    <rect x="68" y="148" width="120" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
    <!-- Mechanical Keys row -->
    <circle cx="86" cy="162" r="5" fill="#f59e0b" />
    <circle cx="102" cy="162" r="5" fill="#f59e0b" />
    <circle cx="118" cy="162" r="5" fill="#f59e0b" />
    <circle cx="134" cy="162" r="5" fill="#f59e0b" />
    <circle cx="150" cy="162" r="5" fill="#f59e0b" />
    <circle cx="166" cy="162" r="5" fill="#f59e0b" />

    <!-- Spacebar -->
    <rect x="98" y="174" width="56" height="6" rx="2" fill="#fbbf24" />

    <!-- Ink Quill Plume crossing down -->
    <path d="M178 52 Q158 84 136 122 Q144 116 156 112 Q172 88 184 56 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
    <line x1="136" y1="122" x2="128" y2="134" stroke="#d97706" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
