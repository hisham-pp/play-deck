<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1808" />
      <stop offset="45%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="amberCoverGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <filter id="neonCoverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#coverBg)" />
  <rect width="800" height="450" fill="url(#amberCoverGlow)" />

  <!-- Parchment Scanlines -->
  <g opacity="0.1" stroke="#f59e0b" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
  </g>

  <!-- Central Parchment & Typewriter Illustration -->
  <g filter="url(#neonCoverGlow)" transform="translate(400, 160)">
    <!-- Sheet of Paper -->
    <path d="M-80 -80 L60 -80 L80 -60 L80 60 L-80 60 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
    <path d="M60 -80 L60 -60 L80 -60 Z" fill="#fde68a" stroke="#d97706" stroke-width="2" />

    <!-- Typewriter lines -->
    <line x1="-60" y1="-50" x2="10" y2="-50" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="-30" x2="40" y2="-30" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="-10" x2="20" y2="-10" stroke="#92400e" stroke-width="3" stroke-linecap="round" />
    <line x1="-60" y1="10" x2="50" y2="10" stroke="#92400e" stroke-width="3" stroke-linecap="round" />

    <!-- Mechanical Carriage & Body -->
    <rect x="-110" y="30" width="220" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="4" />
    <!-- Metallic Keys -->
    <circle cx="-80" cy="55" r="7" fill="#f59e0b" />
    <circle cx="-50" cy="55" r="7" fill="#f59e0b" />
    <circle cx="-20" cy="55" r="7" fill="#f59e0b" />
    <circle cx="10" cy="55" r="7" fill="#f59e0b" />
    <circle cx="40" cy="55" r="7" fill="#f59e0b" />
    <circle cx="70" cy="55" r="7" fill="#f59e0b" />
    <!-- Spacebar -->
    <rect x="-45" y="72" width="90" height="8" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="400" y="340" font-family="serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">ONE WORD STORY</text>
  <text x="400" y="375" font-family="monospace" font-size="14" font-weight="bold" fill="#f59e0b" text-anchor="middle" letter-spacing="4">COLLABORATIVE STORYCRAFT &amp; PARTY TALES</text>
</svg>
