<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="c4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="amberDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="c4Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#c4Bg)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" />

  <!-- Blue Grid Faceplate -->
  <rect x="36" y="44" width="184" height="168" rx="16" fill="#1e3a8a" stroke="#2563eb" stroke-width="4" />

  <!-- 4x4 Grid Holes with Discs -->
  <!-- Row 1 (y=74) -->
  <circle cx="72" cy="74" r="16" fill="#0f172a" />
  <circle cx="109" cy="74" r="16" fill="#0f172a" />
  <circle cx="146" cy="74" r="16" fill="#0f172a" />
  <circle cx="183" cy="74" r="16" fill="#0f172a" />

  <!-- Row 2 (y=112) -->
  <circle cx="72" cy="112" r="16" fill="#0f172a" />
  <circle cx="109" cy="112" r="16" fill="url(#rubyGrad)" filter="url(#c4Glow)" />
  <circle cx="146" cy="112" r="16" fill="#0f172a" />
  <circle cx="183" cy="112" r="16" fill="url(#amberDisc)" filter="url(#c4Glow)" />

  <!-- Row 3 (y=150) -->
  <circle cx="72" cy="150" r="16" fill="url(#amberDisc)" filter="url(#c4Glow)" />
  <circle cx="109" cy="150" r="16" fill="url(#rubyGrad)" filter="url(#c4Glow)" />
  <circle cx="146" cy="150" r="16" fill="url(#amberDisc)" filter="url(#c4Glow)" />
  <circle cx="183" cy="150" r="16" fill="url(#rubyGrad)" filter="url(#c4Glow)" />

  <!-- Row 4 (y=188) -->
  <circle cx="72" cy="188" r="16" fill="url(#rubyGrad)" filter="url(#c4Glow)" />
  <circle cx="109" cy="188" r="16" fill="url(#amberDisc)" filter="url(#c4Glow)" />
  <circle cx="146" cy="188" r="16" fill="url(#rubyGrad)" filter="url(#c4Glow)" />
  <circle cx="183" cy="188" r="16" fill="url(#amberDisc)" filter="url(#c4Glow)" />
</svg>
