<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bounceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="50%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <radialGradient id="paddleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bounceBg)" />

  <!-- Prismatic Brick Wall Rows -->
  <g>
    <!-- Row 1: Ruby Red -->
    <g transform="translate(100, 60)">
      <rect x="0" y="0" width="85" height="32" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
      <rect x="100" y="0" width="85" height="32" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
      <rect x="200" y="0" width="85" height="32" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
      <rect x="300" y="0" width="85" height="32" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
      <rect x="400" y="0" width="85" height="32" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
      <rect x="500" y="0" width="85" height="32" rx="6" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5" />
    </g>

    <!-- Row 2: Amber Gold -->
    <g transform="translate(100, 105)">
      <rect x="0" y="0" width="85" height="32" rx="6" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5" />
      <rect x="100" y="0" width="85" height="32" rx="6" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5" />
      <!-- Shattering brick explosion effect -->
      <g transform="translate(200, 0)">
        <polygon points="5,5 35,2 25,28 8,25" fill="#f59e0b" />
        <polygon points="40,2 80,8 75,30 45,28" fill="#f59e0b" />
        <polygon points="25,28 55,29 50,38 20,35" fill="#fbbf24" />
      </g>
      <rect x="300" y="0" width="85" height="32" rx="6" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5" />
      <rect x="400" y="0" width="85" height="32" rx="6" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5" />
      <rect x="500" y="0" width="85" height="32" rx="6" fill="#f59e0b" stroke="#fde68a" stroke-width="1.5" />
    </g>

    <!-- Row 3: Emerald Green -->
    <g transform="translate(100, 150)">
      <rect x="0" y="0" width="85" height="32" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5" />
      <rect x="100" y="0" width="85" height="32" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5" />
      <rect x="200" y="0" width="85" height="32" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5" />
      <rect x="300" y="0" width="85" height="32" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5" />
      <rect x="400" y="0" width="85" height="32" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5" />
      <rect x="500" y="0" width="85" height="32" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5" />
    </g>
  </g>

  <!-- Laser Ball Trajectory & Motion Trails -->
  <path d="M 400 360 L 320 137" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 6" stroke-opacity="0.5" />

  <!-- Ball -->
  <g transform="translate(320, 137)" filter="url(#laserGlow)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#38bdf8" stroke-width="3" />
    <!-- Impact spark ring -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Arcade Paddle -->
  <g transform="translate(320, 360)" filter="url(#laserGlow)">
    <rect x="-80" y="0" width="160" height="20" rx="10" fill="#06b6d4" stroke="#e0f2fe" stroke-width="2" />
    <circle cx="-50" cy="10" r="4" fill="#ffffff" />
    <circle cx="50" cy="10" r="4" fill="#ffffff" />
  </g>

  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#06b6d4" fill-opacity="0.12" letter-spacing="4">BALL BOUNCE</text>
</svg>
