<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="chessBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120f0a" />
      <stop offset="50%" stop-color="#1e1810" />
      <stop offset="100%" stop-color="#080705" />
    </linearGradient>
    <radialGradient id="goldSpotlight" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPiece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="silverPiece" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#chessBg)" />
  <rect width="800" height="450" fill="url(#goldSpotlight)" />

  <!-- Isometric Chess Board Floor -->
  <g transform="translate(400, 310) scale(1.6, 0.6) rotate(45)" opacity="0.25">
    <rect x="-160" y="-160" width="80" height="80" fill="#f59e0b" />
    <rect x="0" y="-160" width="80" height="80" fill="#f59e0b" />
    <rect x="-80" y="-80" width="80" height="80" fill="#f59e0b" />
    <rect x="80" y="-80" width="80" height="80" fill="#f59e0b" />
    <rect x="-160" y="0" width="80" height="80" fill="#f59e0b" />
    <rect x="0" y="0" width="80" height="80" fill="#f59e0b" />
    <rect x="-80" y="80" width="80" height="80" fill="#f59e0b" />
    <rect x="80" y="80" width="80" height="80" fill="#f59e0b" />
  </g>

  <!-- Chess Pieces -->
  <!-- Knight (Left) -->
  <g transform="translate(240, 110) scale(1.1)">
    <!-- Shadow -->
    <ellipse cx="60" cy="230" rx="55" ry="16" fill="#000000" opacity="0.6" />
    <!-- Knight Path -->
    <path d="M 40 220 L 80 220 L 75 180 C 75 160 85 145 95 135 C 105 125 110 105 100 80 C 95 65 80 55 60 50 C 45 46 30 55 25 70 C 20 85 28 95 40 95 C 45 95 48 90 45 85 C 38 75 42 62 55 65 C 65 67 75 75 75 95 C 65 92 50 96 42 108 C 35 120 38 135 48 140 C 40 148 35 160 35 180 Z" fill="url(#silverPiece)" />
    <path d="M 30 220 L 90 220 L 85 230 L 35 230 Z" fill="#94a3b8" />
  </g>

  <!-- King (Center Right) -->
  <g transform="translate(460, 70) scale(1.25)">
    <!-- Shadow -->
    <ellipse cx="60" cy="250" rx="65" ry="18" fill="#000000" opacity="0.7" />
    <!-- Cross on Top -->
    <rect x="56" y="20" width="8" height="24" rx="2" fill="#fde68a" />
    <rect x="48" y="26" width="24" height="8" rx="2" fill="#fde68a" />
    <!-- Crown -->
    <path d="M 45 50 Q 60 42 75 50 L 82 70 Q 60 78 38 70 Z" fill="url(#goldPiece)" />
    <!-- Body Column -->
    <path d="M 40 75 Q 60 80 80 75 L 75 140 Q 60 145 45 140 Z" fill="url(#goldPiece)" />
    <ellipse cx="60" cy="142" rx="28" ry="6" fill="#fde68a" />
    <!-- Lower base flared -->
    <path d="M 42 145 L 30 220 L 90 220 L 78 145 Z" fill="url(#goldPiece)" />
    <!-- Base plinth -->
    <rect x="22" y="220" width="76" height="14" rx="4" fill="url(#goldPiece)" stroke="#fde68a" stroke-width="1.5" />
  </g>

  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#f59e0b" fill-opacity="0.12" letter-spacing="4">MASTER CHESS</text>
</svg>
