<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="36" fill="#090D16"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="url(#sword_sky)"/>
  
  <!-- Moonlight Orb in Arena -->
  <circle cx="600" cy="180" r="100" fill="#F8FAFC" fill-opacity="0.08"/>
  <circle cx="600" cy="180" r="70" fill="#F8FAFC" fill-opacity="0.12"/>

  <!-- Bamboo Forest Silhouette in Background -->
  <rect x="180" y="160" width="12" height="430" fill="#0F172A" opacity="0.6"/>
  <rect x="220" y="210" width="14" height="380" fill="#1E293B" opacity="0.7"/>
  <rect x="360" y="190" width="10" height="400" fill="#0F172A" opacity="0.5"/>
  <rect x="820" y="170" width="14" height="420" fill="#1E293B" opacity="0.7"/>
  <rect x="940" y="220" width="12" height="370" fill="#0F172A" opacity="0.6"/>
  <rect x="1000" y="180" width="16" height="410" fill="#1E293B" opacity="0.8"/>

  <!-- Dojo Arena Wooden Deck -->
  <rect x="120" y="460" width="960" height="130" fill="#111827" stroke="#1E293B" stroke-width="4"/>
  <line x1="120" y1="480" x2="1080" y2="480" stroke="#334155" stroke-width="3"/>
  <line x1="120" y1="520" x2="1080" y2="520" stroke="#1E293B" stroke-width="2"/>

  <!-- Duelist 1 (Hero / Cyan Katana) -->
  <circle cx="480" cy="340" r="28" fill="#F8FAFC"/>
  <!-- Torso in combat lunge -->
  <path d="M480 368L515 440" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round"/>
  <!-- Lead Attack Arm holding Katana -->
  <path d="M495 390L550 395L585 375" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cyan Katana Blade -->
  <line x1="575" y1="385" x2="650" y2="330" stroke="#06B6D4" stroke-width="6" stroke-linecap="round"/>
  <line x1="575" y1="385" x2="650" y2="330" stroke="#E0F2FE" stroke-width="2" stroke-linecap="round"/>
  <!-- Stance Legs -->
  <path d="M515 440L555 465L575 490" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M515 440L465 470L440 490" stroke="#F8FAFC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Duelist 2 (Rival / Crimson Katana Parry) -->
  <circle cx="720" cy="340" r="28" fill="#EF4444"/>
  <!-- Torso in defensive guard -->
  <path d="M720 368L690 440" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
  <!-- Parry Arm -->
  <path d="M705 390L660 395L630 380" stroke="#EF4444" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crimson Katana Blade in Clashing Parry -->
  <line x1="640" y1="390" x2="590" y2="320" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="640" y1="390" x2="590" y2="320" stroke="#FEF08A" stroke-width="2" stroke-linecap="round"/>
  <!-- Stance Legs -->
  <path d="M690 440L650 465L630 490" stroke="#EF4444" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M690 440L735 470L760 490" stroke="#EF4444" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Clash Sparks (Point of Contact 620, 350) -->
  <circle cx="620" cy="350" r="8" fill="#FEF08A"/>
  <line x1="620" y1="350" x2="580" y2="310" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="620" y1="350" x2="660" y2="300" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
  <line x1="620" y1="350" x2="600" y2="390" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <line x1="620" y1="350" x2="645" y2="385" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="120" y="110" fill="#F59E0B" font-family="Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="6">PLAYDECK</text>
  <text x="120" y="380" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="96" font-weight="800">STICKMAN</text>
  <text x="120" y="475" fill="#F59E0B" font-family="Arial, sans-serif" font-size="96" font-weight="800">SWORD FIGHT</text>
  <text x="120" y="530" fill="#94A3B8" font-family="Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3">TACTILE DUELS, PARRIES &amp; COUNTERS</text>

  <defs>
    <linearGradient id="sword_sky" x1="120" y1="60" x2="1080" y2="582" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#090D16"/>
      <stop offset="1" stop-color="#18070B"/>
    </linearGradient>
  </defs>
</svg>
