<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#1e2538" />
      <stop offset="100%" stop-color="#0e111a" />
    </linearGradient>
    <linearGradient id="bluePen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="redPen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#deskBg)" />

  <!-- Ruled notebook page lines in background -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="120" y1="0" x2="120" y2="450" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="2" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="130" x2="800" y2="130" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="230" x2="800" y2="230" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="330" x2="800" y2="330" />
    <line x1="0" y1="380" x2="800" y2="380" />
  </g>

  <!-- Blue Pen (Attacking from Left) -->
  <g transform="translate(260, 240) rotate(35)">
    <!-- Pen Barrel -->
    <rect x="-180" y="-14" width="220" height="28" rx="6" fill="url(#bluePen)" stroke="#bae6fd" stroke-width="1.5" />
    <!-- Metallic Grip rings -->
    <rect x="-30" y="-14" width="8" height="28" fill="#e2e8f0" />
    <rect x="-15" y="-14" width="8" height="28" fill="#e2e8f0" />
    <!-- Nib cone -->
    <polygon points="40,-12 85,-2 85,2 40,12" fill="#cbd5e1" />
    <circle cx="85" cy="0" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Red Pen (Defending from Right) -->
  <g transform="translate(520, 210) rotate(-145)">
    <rect x="-180" y="-14" width="220" height="28" rx="6" fill="url(#redPen)" stroke="#fecaca" stroke-width="1.5" />
    <rect x="-30" y="-14" width="8" height="28" fill="#e2e8f0" />
    <rect x="-15" y="-14" width="8" height="28" fill="#e2e8f0" />
    <polygon points="40,-12 85,-2 85,2 40,12" fill="#cbd5e1" />
    <circle cx="85" cy="0" r="2.5" fill="#ef4444" />
  </g>

  <!-- Clash Impact Point with Shockwave Sparks -->
  <g transform="translate(390, 225)" filter="url(#sparkGlow)">
    <circle cx="0" cy="0" r="32" fill="#facc15" opacity="0.3" />
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    <!-- Spark Starburst -->
    <line x1="-40" y1="-20" x2="40" y2="20" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
    <line x1="-30" y1="35" x2="30" y2="-35" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Arena Boundary Edge Warning Lines -->
  <line x1="20" y1="430" x2="780" y2="430" stroke="#f59e0b" stroke-width="3" stroke-dasharray="10 10" />

  <text x="50" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#38bdf8" fill-opacity="0.12" letter-spacing="4">PEN FIGHT 3D</text>
</svg>
