<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="36" fill="#090D16"/>
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="url(#shooter_linear)"/>
  
  <!-- Tactical grid & crosshairs in background -->
  <line x1="40" y1="460" x2="1160" y2="460" stroke="#1E293B" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="880" cy="260" r="140" stroke="#EF4444" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="880" cy="260" r="70" stroke="#EF4444" stroke-opacity="0.6" stroke-width="2"/>
  <circle cx="880" cy="260" r="6" fill="#EF4444"/>
  <line x1="880" y1="100" x2="880" y2="420" stroke="#EF4444" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="720" y1="260" x2="1040" y2="260" stroke="#EF4444" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Enemy stickman silhouettes in distance -->
  <circle cx="880" cy="225" r="28" fill="#DC2626"/>
  <path d="M880 253V315" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>
  <path d="M880 270L850 300" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <path d="M880 270L910 295" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <path d="M880 315L860 370" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>
  <path d="M880 315L900 370" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>

  <!-- Distance cover barrier / bunker -->
  <rect x="830" y="350" width="100" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="3"/>

  <!-- Tactical sandbags in foreground for player -->
  <rect x="520" y="380" width="220" height="80" rx="16" fill="#334155" stroke="#475569" stroke-width="4"/>
  <rect x="560" y="320" width="180" height="70" rx="14" fill="#1E293B" stroke="#334155" stroke-width="4"/>

  <!-- Hero Stickman Operative in Cover -->
  <circle cx="610" cy="200" r="50" fill="#F8FAFC"/>
  <!-- Torso leaning into rifle -->
  <path d="M610 250L600 350" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round"/>
  <!-- Arms aiming tactical assault rifle -->
  <path d="M605 275L660 280L710 270" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M605 275L630 305L675 285" stroke="#F8FAFC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tactical Weapon -->
  <rect x="660" y="260" width="110" height="22" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
  <rect x="770" y="266" width="35" height="10" rx="2" fill="#334155"/>
  <rect x="685" y="282" width="18" height="24" rx="2" fill="#F59E0B"/>
  
  <!-- Muzzle Flash & Laser Sight -->
  <path d="M805 271L845 260L830 271L855 276L815 278Z" fill="#F59E0B"/>
  <line x1="805" y1="271" x2="880" y2="260" stroke="#EF4444" stroke-width="3" stroke-dasharray="10 6"/>

  <!-- Flying Cartridges -->
  <rect x="670" y="235" width="10" height="5" rx="1.5" fill="#F59E0B" transform="rotate(-35 670 235)"/>
  <rect x="685" y="220" width="10" height="5" rx="1.5" fill="#FBBF24" transform="rotate(25 685 220)"/>

  <!-- Typography -->
  <text x="120" y="110" fill="#F59E0B" font-family="Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="6">PLAYDECK</text>
  <text x="120" y="380" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="96" font-weight="800">STICKMAN</text>
  <text x="120" y="475" fill="#F59E0B" font-family="Arial, sans-serif" font-size="96" font-weight="800">SHOOTER</text>
  <text x="120" y="530" fill="#94A3B8" font-family="Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="3">TACTICAL COVER &amp; WAVE DEFENSE</text>

  <defs>
    <linearGradient id="shooter_linear" x1="120" y1="60" x2="1080" y2="582" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#090D16"/>
      <stop offset="1" stop-color="#180B0F"/>
    </linearGradient>
  </defs>
</svg>
