<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200808" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#ef4444" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <g transform="translate(20, 20) rotate(-15 100 100)">
      <rect x="50" y="30" width="80" height="120" rx="10" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
      <ellipse cx="90" cy="90" rx="28" ry="42" fill="#ffffff" transform="rotate(30 90 90)"/>
      <text x="90" y="102" font-size="34" font-weight="900" fill="#ef4444" text-anchor="middle">7</text>
    </g>
    <g transform="translate(60, 40) rotate(15 130 110)">
      <rect x="80" y="40" width="80" height="120" rx="10" fill="#3b82f6" stroke="#ffffff" stroke-width="4"/>
      <ellipse cx="120" cy="100" rx="28" ry="42" fill="#ffffff" transform="rotate(30 120 100)"/>
      <text x="120" y="112" font-size="34" font-weight="900" fill="#3b82f6" text-anchor="middle">★</text>
    </g>
  </g>
</svg>
