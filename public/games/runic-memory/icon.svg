<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="runeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="runePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="runeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="runeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="url(#runeBg)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#a855f7" stroke-width="2" stroke-opacity="0.4" />

  <!-- Two tilted matching memory cards -->
  <!-- Back Card -->
  <g transform="rotate(-10 128 128)">
    <rect x="44" y="60" width="84" height="116" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
    <path d="M72 88 L98 144 M98 88 L72 144 M85 76 V156" stroke="url(#runeCyan)" stroke-width="4" stroke-linecap="round" filter="url(#runeGlow)" />
  </g>

  <!-- Front Card -->
  <g transform="rotate(12 148 136)">
    <rect x="116" y="70" width="84" height="116" rx="12" fill="#3b0764" stroke="#a855f7" stroke-width="3.5" />
    <circle cx="158" cy="128" r="22" fill="none" stroke="url(#runePurple)" stroke-width="4" stroke-dasharray="8 4" filter="url(#runeGlow)" />
    <path d="M158 114 V142 M144 128 H172" stroke="url(#runePurple)" stroke-width="5" stroke-linecap="round" filter="url(#runeGlow)" />
    <!-- Glowing corner nodes -->
    <circle cx="128" cy="82" r="3" fill="#f0abfc" />
    <circle cx="188" cy="82" r="3" fill="#f0abfc" />
    <circle cx="128" cy="174" r="3" fill="#f0abfc" />
    <circle cx="188" cy="174" r="3" fill="#f0abfc" />
  </g>
</svg>
