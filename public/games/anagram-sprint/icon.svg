<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#250c18" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#f97316" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <circle cx="128" cy="128" r="64" fill="none" stroke="#f97316" stroke-width="6" stroke-dasharray="16 10"/>
      <text x="128" y="142" font-size="44" font-weight="bold" fill="#ec4899" text-anchor="middle">↺</text>
  </g>
</svg>
