<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e05" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#84cc16" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)" />
  <rect width="254" height="254" x="1" y="1" rx="47" fill="none" stroke="#84cc16" stroke-width="2" stroke-opacity="0.3" />

  <!-- Inner Court Arena -->
  <rect x="24" y="24" width="208" height="208" rx="24" fill="#070b14" stroke="#1e293b" stroke-width="2" />
  <circle cx="128" cy="128" r="80" fill="url(#glowGrad)" />

  <!-- Thematic Iconography -->
  <g filter="url(#neonGlow)">
    <rect x="70" y="95" width="90" height="66" rx="12" fill="#65a30d" stroke="#365314" stroke-width="4"/>
      <line x1="120" y1="128" x2="190" y2="128" stroke="#365314" stroke-width="10" stroke-linecap="round"/>
      <circle cx="120" cy="128" r="22" fill="#84cc16"/>
  </g>
</svg>
