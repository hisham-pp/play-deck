<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base with subtle rounded border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#232f45" stroke-width="2" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#amberGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" />

  <!-- Gamepad Body -->
  <g filter="url(#amberGlow)">
    <path d="M168 160 C110 160 80 196 80 252 C80 316 112 364 154 364 C178 364 196 342 220 316 C232 304 244 298 256 298 C268 298 280 304 292 316 C316 342 334 364 358 364 C400 364 432 316 432 252 C432 196 402 160 344 160 Z"
          fill="#1c2438"
          stroke="#2d3c59"
          stroke-width="8" />
  </g>

  <!-- Inner contour / Grip accent lines -->
  <path d="M120 280 C116 260 116 230 134 200" stroke="#37486c" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M392 280 C396 260 396 230 378 200" stroke="#37486c" stroke-width="6" stroke-linecap="round" fill="none" />

  <!-- D-Pad (Left side) -->
  <g transform="translate(142, 218)">
    <rect x="22" y="0" width="22" height="66" rx="6" fill="#090d16" stroke="#232f45" stroke-width="3" />
    <rect x="0" y="22" width="66" height="22" rx="6" fill="#090d16" stroke="#232f45" stroke-width="3" />
    <circle cx="33" cy="33" r="4" fill="#37486c" />
    <!-- Up/Down/Left/Right arrows/dots -->
    <circle cx="33" cy="11" r="2.5" fill="#f59e0b" />
    <circle cx="33" cy="55" r="2.5" fill="#f59e0b" />
    <circle cx="11" cy="33" r="2.5" fill="#f59e0b" />
    <circle cx="55" cy="33" r="2.5" fill="#f59e0b" />
  </g>

  <!-- Action Buttons (Right side - 4 tactical buttons) -->
  <g transform="translate(304, 218)">
    <!-- Top button (Y) -->
    <circle cx="33" cy="12" r="11" fill="#090d16" stroke="#232f45" stroke-width="3" />
    <circle cx="33" cy="12" r="6" fill="url(#amberGrad)" />

    <!-- Right button (B) -->
    <circle cx="54" cy="33" r="11" fill="#090d16" stroke="#232f45" stroke-width="3" />
    <circle cx="54" cy="33" r="6" fill="url(#amberGrad)" />

    <!-- Bottom button (A) -->
    <circle cx="33" cy="54" r="11" fill="#090d16" stroke="#232f45" stroke-width="3" />
    <circle cx="33" cy="54" r="6" fill="url(#amberGrad)" />

    <!-- Left button (X) -->
    <circle cx="12" cy="33" r="11" fill="#090d16" stroke="#232f45" stroke-width="3" />
    <circle cx="12" cy="33" r="6" fill="url(#amberGrad)" />
  </g>

  <!-- Center Menu / Deck pill buttons -->
  <g transform="translate(230, 240)">
    <rect x="0" y="0" width="20" height="8" rx="4" fill="#f59e0b" opacity="0.85" />
    <rect x="32" y="0" width="20" height="8" rx="4" fill="#f59e0b" opacity="0.85" />
  </g>

  <!-- Center Indicator Jewel -->
  <circle cx="256" cy="204" r="6" fill="url(#amberGrad)" />
  <circle cx="256" cy="204" r="12" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 3" opacity="0.6" />
</svg>
